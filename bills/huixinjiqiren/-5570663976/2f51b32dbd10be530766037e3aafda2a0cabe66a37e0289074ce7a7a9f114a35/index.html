    }
    function operatorName(entry) {
      return entry.username || "未知";
    }
    function remark(entry) {
      if (entry.group_key && entry.note) return entry.note;
      if (entry.is_deposit) return "寄存";
      return "";
    }
    function entryTime(entry) {
      if (entry.created_at && entry.created_at.length >= 19) return entry.created_at.slice(5, 10) + " " + entry.created_at.slice(11, 19);
      return entry.created_at || "";
    }
    function currentDay() {
      return bill.today || new Date().toISOString().slice(0, 10);
    }
    function setDefaultTimes() {
      const day = daySelect.value === "all" || daySelect.value === "current" ? currentDay() : daySelect.value;
      if (!startAt.value) startAt.value = day + "T00:00";
      if (!endAt.value) endAt.value = day + "T23:59";
    }
    function initDays() {
      const options = [["current", "当前账单"], ["all", "全部历史"], ...bill.dates.map(day => [day, day])];
      daySelect.innerHTML = options.map(([value, label]) => `<option value="${escapeHtml(value)}">${escapeHtml(label)}</option>`).join("");
      setDefaultTimes();
    }
    function selectedEntries() {
      let rows = bill.entries.slice();
      if (daySelect.value === "current") rows = rows.filter(entry => entry.occurred_on === currentDay() && !entry.deleted_at);
      else if (daySelect.value !== "all") rows = rows.filter(entry => entry.occurred_on === daySelect.value && !entry.deleted_at);
      if (timeSearch.checked) {
        const startValue = startAt.value ? startAt.value.replace("T", " ") : "";
        const endValue = endAt.value ? endAt.value.replace("T", " ") + ":59" : "";
        rows = rows.filter(entry => (!startValue || entry.created_at >= startValue) && (!endValue || entry.created_at <= endValue));
      }
      return rows;
    }
    function incomeRow(entry) {
      return `<tr><td>${escapeHtml(entryTime(entry))}</td><td><span class="money-main">${money(entry.cny_amount)}</span><span class="subline">${percent(entry.fee_rate)} = ${money(entry.rate)}</span></td><td>${money(entry.usdt_amount)}</td><td>${escapeHtml(marker(entry))}</td><td>${escapeHtml(operatorName(entry))}</td><td>${escapeHtml(remark(entry))}</td></tr>`;
    }
    function disbursementRow(entry) {
      const amount = entry.currency === "CNY" ? `${money(entry.usdt_amount)} (${money(entry.cny_amount)})` : money(entry.usdt_amount);
      return `<tr><td>${escapeHtml(entryTime(entry))}</td><td><span class="coin">T</span>${escapeHtml(amount)}</td><td>${escapeHtml(marker(entry))}</td><td>${escapeHtml(operatorName(entry))}</td><td>${escapeHtml(remark(entry))}</td></tr>`;
    }
    function table(title, rows, columns, rowRenderer) {
      const empty = `<tr><td colspan="${columns.length}">暂无记录</td></tr>`;
      return `<h2>${title}(${rows.length}笔)</h2><div class="table-wrap"><table class="bill"><thead><tr>${columns.map(name => `<th>${name}</th>`).join("")}</tr></thead><tbody>${rows.map(rowRenderer).join("") || empty}</tbody></table></div>`;
    }
    function aggregate(rows, keyFn) {
      const groups = new Map();
      rows.forEach(entry => {
        const key = keyFn(entry) || "未标记";
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(entry);
      });
      return [...groups.entries()].sort((a, b) => a[0].localeCompare(b[0], "zh-CN"));
    }
    function category(title, grouped) {
      if (!grouped.length) return `<details><summary>${escapeHtml(title)}</summary><div class="empty">暂无数据</div></details>`;
      const rows = grouped.map(([name, items]) => {
        const incomeU = sum(items.filter(e => e.entry_type === "income"), "usdt_amount");
        const payoutU = sum(items.filter(e => e.entry_type === "payout"), "usdt_amount");
        const disbursedU = sum(items.filter(e => e.entry_type === "disbursement"), "usdt_amount");
        const cnyTotal = sum(items.filter(e => e.entry_type === "income"), "cny_amount") - sum(items.filter(e => e.entry_type === "payout"), "cny_amount");
        return `<tr><td>${escapeHtml(name)}</td><td>${items.length}</td><td>${money(cnyTotal)}</td><td>${money(incomeU - payoutU)}</td><td>${money(disbursedU)}</td></tr>`;
      }).join("");
      return `<details><summary>${escapeHtml(title)}</summary><table class="category-table"><thead><tr><th>分类</th><th>笔数</th><th>总入款</th><th>应下发</th><th>已下发</th></tr></thead><tbody>${rows}</tbody></table></details>`;
    }
    function sum(rows, key) {
      return rows.reduce((total, entry) => total + Number(entry[key] || 0), 0);
    }
    function render() {
      const rows = selectedEntries();
      const income = rows.filter(entry => entry.entry_type === "income");
      const payout = rows.filter(entry => entry.entry_type === "payout");
      const disbursement = rows.filter(entry => entry.entry_type === "disbursement");
      const totalCny = sum(income, "cny_amount") - sum(payout, "cny_amount");
      const shouldU = sum(income, "usdt_amount") - sum(payout, "usdt_amount");
      const disbursedU = sum(disbursement, "usdt_amount");
      exportXlsx.href = bill.xlsx[daySelect.value] || "bill-current.xlsx";
      content.innerHTML = [
        table("入账", income, ["时间", "金额", "结算", "标记人", "操作人", "备注"], incomeRow),
        payout.length ? table("代付", payout, ["时间", "金额", "结算", "标记人", "操作人", "备注"], incomeRow) : "",
        table("下发", disbursement, ["时间", "金额", "标记人", "操作人", "备注"], disbursementRow),
        rows.length ? "" : '<div class="empty">暂无账单记录。</div>',
        '<div class="category-title">记账分类</div>',
        category("按(操作员)分类", aggregate(rows, operatorName)),
        category("按(标记类)分组", aggregate(rows, marker)),
        category("按(备注)分组", aggregate(rows, remark)),
        category("按(入款汇率)分类", aggregate(income, entry => money(entry.rate))),
        category("按(入款汇率和操作人)分类", aggregate(income, entry => money(entry.rate) + " / " + operatorName(entry))),
        `<div class="total-title">总计</div><div class="total"><p>总入款： ${money(totalCny)}</p><p>应下发： ${money(shouldU)} <span class="coin">T</span></p><p>已下发： ${money(disbursedU)} <span class="coin">T</span></p><p>未下发： ${money(shouldU - disbursedU)} <span class="coin">T</span></p></div>`,
      ].join("");
    }
    document.getElementById("filters").addEventListener("submit", event => {
      event.preventDefault();
      render();
    });
    daySelect.addEventListener("change", () => {
      startAt.value = "";
      endAt.value = "";
      setDefaultTimes();
      render();
    });
    timeSearch.addEventListener("change", render);
    startAt.addEventListener("change", render);
    endAt.addEventListener("change", render);
    initDays();
    render();
  </script>
</body>
</html>
